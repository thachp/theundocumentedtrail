<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guided design comparison</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #071016; color: #f1e7d0; font: 600 14px/1.4 system-ui, sans-serif; }
      figure { margin: 0; }
      figcaption { height: 34px; padding: 7px 12px; background: #101c22; letter-spacing: .12em; text-transform: uppercase; }
      img { display: block; width: 100vw; height: auto; object-fit: contain; background: #000; }
    </style>
  </head>
  <body>
    <figure>
      <figcaption>Source reference</figcaption>
      <img src="/qa/guided-reference.png" alt="Source reference" />
    </figure>
    <figure>
      <figcaption>Rendered implementation — opening state</figcaption>
      <img src="/qa/guided-implementation.png" alt="Rendered implementation" />
    </figure>
  </body>
</html>
